# Virtual workspace manifest. Every crate lives under `crates/` (MS Rust Guidelines
# M-CRATES-FLAT-FOLDER) and is listed here as a member (M-CRATES-IN-WORKSPACE).
# Shared metadata / dependency versions / lint policy are declared once, at the
# workspace level, and inherited by each member via `*.workspace = true`
# (M-CARGO-WORKSPACE).

[workspace]
members = [
    "crates/shirley",
    "crates/shirley-agent-sdk",
    "crates/shirley-agent-sdk-macros",
]
# `cargo run` / `cargo build` with no `-p` operate on the application crate, so the
# familiar `cargo run` (TUI) keeps working from the repository root.
default-members = ["crates/shirley"]
resolver = "3"

# Intra-workspace dependencies resolve to a single canonical version (M-CRATES-IN-WORKSPACE).
[workspace.dependencies]
shirley-agent-sdk = { version = "0.0.3", path = "crates/shirley-agent-sdk" }
shirley-agent-sdk-macros = { version = "0.0.3", path = "crates/shirley-agent-sdk-macros" }

# ---------------------------------------------------------------------------
# Lint policy: Microsoft "Pragmatic Rust Guidelines"
# https://microsoft.github.io/rust-guidelines/
# See docs/rust-guidelines.md for the adoption plan and the ratchet roadmap.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
# Tier 1 — already clean across the workspace today, enforced as hard errors
# (a real gate: `cargo build`/`clippy` fails if these regress).
ambiguous_negative_literals = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
# Promoted from warn -> deny once the backlog was cleared (ratchet step 1).
missing_debug_implementations = "deny"
redundant_imports = "deny"

[workspace.lints.clippy]
# Tier 2 — advisory (warn) today; the ratchet backlog. CI does not fail on these
# yet; fix incrementally, then flip CI to `-D warnings`. (MS recommends "warn".)
cargo = { level = "warn", priority = -1 }
complexity = { level = "deny", priority = -1 }
# Promoted to deny once the backlog was cleared (ratchet step 2). These groups
# are the "definitely a bug" class; a hit here now fails the build.
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# Restriction-group lints explicitly called out by the MS guidelines.
allow_attributes_without_reason = "deny"
cargo_common_metadata = "deny"   # every crate carries description/license/repository/keywords/categories
clone_on_ref_ptr = "deny"   # use Arc::clone(&x) instead of x.clone() on ref-counted pointers
map_err_ignore = "deny"   # name the ignored error (|_e|) so the discard is explicit
undocumented_unsafe_blocks = "deny"   # every unsafe block carries a // SAFETY: note
unused_result_ok = "deny"   # prefer `let _ = ...;` over `.ok();` for intentionally ignored Results
# Structured logging: do not treat literal formatting args as a format string.
literal_string_with_formatting_args = "allow"

# Pedantic subset cleared and promoted to deny (ratchet step 3). Each of these had a
# zero backlog after the batch-A cleanups; a hit now fails the build.
uninlined_format_args = "deny"
manual_string_new = "deny"
range_plus_one = "deny"
checked_conversions = "deny"
single_char_pattern = "deny"
semicolon_if_nothing_returned = "deny"
unnested_or_patterns = "deny"
unnecessary_join = "deny"
if_not_else = "deny"
unreadable_literal = "deny"
default_trait_access = "deny"
needless_continue = "deny"
format_collect = "deny"
items_after_statements = "deny"
ref_option = "deny"
too_long_first_doc_paragraph = "deny"
# Pedantic/restriction subset cleared and promoted to deny (ratchet step 4).
assigning_clones = "deny"
map_unwrap_or = "deny"
float_cmp = "deny"
match_same_arms = "deny"
trivially_copy_pass_by_ref = "deny"
unnecessary_wraps = "deny"
redundant_closure_for_method_calls = "deny"
# Deliberate opt-outs: numeric-cast family is noisy on a brownfield codebase and
# is deferred to the ratchet rather than blocking the initial adoption.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
cast_ptr_alignment = "allow"
