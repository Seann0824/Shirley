[package]
name = "Shirley"
version = "0.0.2-alpha"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
memchr = "2.7"
shirley-agent-sdk = { version = "0.0.2-alpha", path = "./crates/shirley-agent-sdk" }
syn = { version = "3.0.6", features = ["full"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
schemars = { version = "1.2.2", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "fs", "io-util"] }
dotenvy = "0.15.7"
toml = "0.9"
dirs = "6"
thiserror = "2.0.21"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
url = "2.5.8"
chrono = "0.4.45"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29.0"
unicode-width = "0.2"
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
arboard = { version = "3.6.1", default-features = false }
tauri = { version = "2", optional = true }

[features]
default = []
# 桌面界面（Tauri 2 壳）。默认关闭，避免 TUI-only 构建被迫拉入 webview 依赖。
desktop = ["dep:tauri"]

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[workspace]
members = [
    "crates/shirley-agent-sdk",
    "crates/shirley-agent-sdk-macros",
]
resolver = "3"
