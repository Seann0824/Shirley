[package]
name = "Shirley"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
agent-sdk = { version = "0.1.0", path = "./crates/agent-sdk" }

[workspace]
members = [
    "crates/agent-sdk",
    "crates/agent-sdk-macros",
]
resolver = "3"