[package]
name = "Shirley"
version = "0.0.2"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
memchr = "2.7"
ignore = "0.4"
globset = "0.4"
regex = "1"
shirley-agent-sdk = { version = "0.0.2", path = "./crates/shirley-agent-sdk" }
syn = { version = "3.0.6", features = ["full"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
schemars = { version = "1.2.2", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "fs", "io-util", "net"] }
dotenvy = "0.15.7"
toml = "0.9"
dirs = "6"
thiserror = "2.0.21"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
url = "2.5.8"
uuid = { version = "1", features = ["v5"] }
chrono = "0.4.45"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29.0"
unicode-width = "0.2"
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
arboard = { version = "3.6.1", default-features = false }
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2.7.1", optional = true }
# Cloud web server (axum HTTP + WebSocket). Off by default; only pulled in by the `server` feature.
axum = { version = "0.8", optional = true, features = ["ws"] }
tower-http = { version = "0.6", optional = true, features = ["fs", "trace"] }

[features]
default = []
# Desktop interface (Tauri 2 shell). Off by default, to avoid forcing a TUI-only build to pull in webview deps.
desktop = ["dep:tauri", "dep:tauri-plugin-dialog"]
# Cloud web interface (HTTP command API + WebSocket event push + static frontend hosting).
server = ["dep:axum", "dep:tower-http"]

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[workspace]
members = [
    "crates/shirley-agent-sdk",
    "crates/shirley-agent-sdk-macros",
]
resolver = "3"

# ---------------------------------------------------------------------------
# Lint policy: Microsoft "Pragmatic Rust Guidelines"
# https://microsoft.github.io/rust-guidelines/
# See docs/rust-guidelines.md for the adoption plan and the ratchet roadmap.
# ---------------------------------------------------------------------------
[lints]
workspace = true

[workspace.lints.rust]
# Tier 1 — already clean across the workspace today, enforced as hard errors
# (a real gate: `cargo build`/`clippy` fails if these regress).
ambiguous_negative_literals = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
# Promoted from warn -> deny once the backlog was cleared (ratchet step 1).
missing_debug_implementations = "deny"
redundant_imports = "deny"

[workspace.lints.clippy]
# Tier 2 — advisory (warn) today; the ratchet backlog. CI does not fail on these
# yet; fix incrementally, then flip CI to `-D warnings`. (MS recommends "warn".)
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
# Promoted to deny once the backlog was cleared (ratchet step 2). These groups
# are the "definitely a bug" class; a hit here now fails the build.
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# Restriction-group lints explicitly called out by the MS guidelines.
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
map_err_ignore = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
# Structured logging: do not treat literal formatting args as a format string.
literal_string_with_formatting_args = "allow"
# Deliberate opt-outs: numeric-cast family is noisy on a brownfield codebase and
# is deferred to the ratchet rather than blocking the initial adoption.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
cast_ptr_alignment = "allow"
