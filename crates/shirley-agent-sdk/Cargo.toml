[package]
name = "shirley-agent-sdk"
version = "0.0.2-alpha"
edition = "2024"
description = "Agent SDK for building LLM agents: messages, tools, protocol adapters, ReAct runtime, sandbox and workspace"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Seann0824/Shirley"
keywords = ["agent", "ai", "llm", "tools"]
readme = "README.md"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shirley-agent-sdk-macros = { version = "0.0.2-alpha", path = "../shirley-agent-sdk-macros" }
schemars = { version = "1.2.2", features = ["derive"] }
bon = "3.10.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
futures = "0.3.34"
async-stream = "0.3"
dotenvy = "0.15.7"
tokio = { version = "1.53.1", features = ["process", "time", "io-util", "fs"] }
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
