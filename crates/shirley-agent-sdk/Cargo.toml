[package]
name = "shirley-agent-sdk"
version = "0.0.2"
edition = "2024"
description = "Agent SDK for building LLM agents: messages, tools, protocol adapters, ReAct runtime, sandbox and workspace"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Seann0824/Shirley"
keywords = ["agent", "ai", "llm", "tools"]
readme = "README.md"
categories = ["development-tools", "api-bindings"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shirley-agent-sdk-macros.workspace = true
schemars = { version = "1.2.2", features = ["derive"] }
bon = "3.10.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
futures = "0.3.34"
bytes = "1"
async-stream = "0.3"
dotenvy = "0.15.7"
tokio = { version = "1.53.1", features = ["process", "time", "io-util", "fs"] }
thiserror = "2.0.21"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
