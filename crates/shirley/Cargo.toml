[package]
name = "Shirley"
version = "0.0.5"
edition = "2024"
rust-version = "1.89"
description = "A bot-first agent platform: HTTP/SSE server + React web UI over the shirley-agent-sdk"
license = "MIT OR Apache-2.0"
readme = "../../README.md"
repository = "https://github.com/Seann0824/Shirley"
keywords = ["agent", "ai", "llm", "coding-agent", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "shirley"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
memchr = "2.7"
ignore = "0.4"
globset = "0.4"
regex = "1"
shirley-agent-sdk.workspace = true
schemars = { version = "1.2.2", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "fs", "io-util", "net"] }
dotenvy = "0.15.7"
toml = "0.9"
dirs = "6"
thiserror = "2.0.21"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
url = "2.5.8"
uuid = { version = "1", features = ["v4", "v5"] }
chrono = "0.4.45"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
# Client side of the connectors' long connections (Slack Socket Mode, Feishu).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }

# Computer use (macOS accessibility API + CGEvent keystrokes). Gated by target so the other
# platforms never link the framework bindings; `src/computer/stub.rs` covers them.
[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2.0"
core-foundation = "0.10"
core-foundation-sys = "0.8.7"

[features]
default = []

[lints]
workspace = true
