<svg xmlns="http://www.w3.org/2000/svg" width="680" height="468" viewBox="0 0 680 468" role="img" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans SC, Helvetica, Arial, sans-serif">
  <title>Shirley 配置结构</title>
  <desc>Shirley 的配置来自四层，每层逐字段覆盖上一层：内置默认、全局配置、工作区配置、环境变量，最终合并成一个 Settings。</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="679" height="467" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>

  <text x="40" y="28" font-size="13" font-weight="500" fill="#5F5E5A" dominant-baseline="central">优先级：低 → 高</text>

  <rect x="40" y="48" width="600" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="60" y="70" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">① 内置默认（代码内）</text>
  <text x="60" y="94" font-size="12" fill="#185FA5" dominant-baseline="central">协议 · 模型 · 上下文窗口</text>

  <rect x="40" y="128" width="600" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="60" y="150" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">② 全局配置</text>
  <text x="60" y="174" font-size="12" fill="#185FA5" dominant-baseline="central">~/Library/Application Support/shirley/config.toml</text>

  <rect x="40" y="208" width="600" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="60" y="230" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">③ 工作区配置</text>
  <text x="60" y="254" font-size="12" fill="#185FA5" dominant-baseline="central">&lt;root&gt;/.shirley/config.toml</text>

  <rect x="40" y="288" width="600" height="84" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="60" y="310" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">④ 环境变量（含 .env）</text>
  <text x="60" y="334" font-size="12" fill="#185FA5" dominant-baseline="central">LOCAL_PROTOCOL · LOCAL_BASE_URL · LOCAL_API_KEY · LOCAL_MODELS_URL · LOCAL_MODEL</text>
  <text x="60" y="356" font-size="12" fill="#185FA5" dominant-baseline="central">LOCAL_CONTEXT_WINDOW_TOKENS · LOCAL_THINKING · LOCAL_REASONING_EFFORT</text>

  <path d="M340 112 L340 128" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <path d="M340 192 L340 208" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <path d="M340 272 L340 288" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="356" y="120" font-size="11" fill="#888780" dominant-baseline="central">覆盖</text>
  <text x="356" y="200" font-size="11" fill="#888780" dominant-baseline="central">覆盖</text>
  <text x="356" y="280" font-size="11" fill="#888780" dominant-baseline="central">覆盖</text>

  <path d="M340 372 L340 396" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <rect x="40" y="396" width="600" height="52" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="422" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">合并结果 Settings —— 逐字段覆盖，未写的键保持原值</text>
</svg>
