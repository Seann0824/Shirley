name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail fast on Tier-1 lint regressions (they are `deny` in Cargo.toml).
  RUSTFLAGS: ""
  # Rust jobs do not need the web bundle; the `web` job builds it.
  SHIRLEY_SKIP_WEB_BUILD: "1"

jobs:
  build-test-clippy:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      # Tier-1 rustc lints are `deny` in [workspace.lints]; a regression fails here.
      # Tier-2 clippy lints are `warn` and only print (advisory ratchet backlog).
      - name: Clippy (Tier-1 gate, Tier-2 advisory)
        run: cargo clippy --workspace --all-targets --locked

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # Blocking: the one-shot `cargo fmt --all` reformat has landed (591 diffs -> 0).
    # See docs/rust-guidelines.md "Ratchet roadmap".
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  audit:
    name: cargo-audit (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prebuilt binary, avoids compiling the tool from source on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Scans Cargo.lock against the RustSec advisory database. A known-vulnerable
      # dependency fails the job. (MS: "cargo-audit verifies crate dependencies for
      # security vulnerabilities".)
      - name: cargo audit
        run: cargo audit

  web:
    name: web UI (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/shirley/src/interface/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
